[workspace]
resolver = "3"
members = [
  "crates/indexloom-core",
  "crates/indexloom-definitions",
  "crates/indexloom-engine",
  "crates/indexloom-importers",
  "crates/indexloom-server",
  "crates/indexloom-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IndexLoom/IndexLoom"
homepage = "https://github.com/IndexLoom/IndexLoom"
authors = ["IndexLoom contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "macros"] }
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "form", "gzip", "http2", "json", "rustls", "stream", "zstd"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "runtime-tokio", "sqlite", "time", "uuid"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.25.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
