[workspace]
resolver = "3"
members = [
  "crates/indexloom-core",
  "crates/indexloom-definitions",
  "crates/indexloom-engine",
  "crates/indexloom-importers",
  "crates/indexloom-native",
  "crates/indexloom-server",
  "crates/indexloom-storage",
  "crates/indexloom-yaml",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IndexLoom/IndexLoom"
homepage = "https://github.com/IndexLoom/IndexLoom"
authors = ["IndexLoom contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
hmac = "0.12.1"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
gtmpl = "0.7.1"
flate2 = "1.1.9"
fancy-regex = "0.19.0"
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "form", "gzip", "http2", "json", "query", "rustls", "socks", "stream", "zstd"] }
regex = "1.12.3"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "indexloom-yaml", path = "crates/indexloom-yaml" }
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "runtime-tokio", "sqlite", "time", "uuid"] }
subtle = "2.6.1"
tar = "0.4.44"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.25.0", features = ["serde", "v7"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
openidconnect = { path = "vendor/openidconnect" }
