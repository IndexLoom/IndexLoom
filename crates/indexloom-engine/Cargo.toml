[package]
name = "indexloom-engine"
description = "HTTP and HTML execution engine for IndexLoom definitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
encoding_rs = "0.8.44"
markup5ever = "0.40.0"
quick-xml = "0.42.0"
unicode-normalization = "0.1.26"
async-trait.workspace = true
publicsuffix = "2.3.0"
cookie_store = { version = "0.22.1", features = ["serde"] }
fancy-regex.workspace = true
gtmpl.workspace = true
getrandom.workspace = true
indexloom-core = { path = "../indexloom-core", version = "0.3.0" }
indexloom-definitions = { path = "../indexloom-definitions", version = "0.3.0" }
regex.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { package = "indexloom-yaml", version = "0.3.0", path = "../indexloom-yaml" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["test-util"] }
