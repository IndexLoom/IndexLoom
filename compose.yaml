name: indexloom

services:
  indexloom:
    image: indexloom:dev
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INDEXLOOM_BIND: 0.0.0.0:8080
      INDEXLOOM_DATABASE_URL: sqlite:///data/indexloom.db?mode=rwc
      INDEXLOOM_WEB_ROOT: /app/web
      INDEXLOOM_ADMIN_TOKEN: ${INDEXLOOM_ADMIN_TOKEN:?set INDEXLOOM_ADMIN_TOKEN}
      INDEXLOOM_MASTER_KEY: ${INDEXLOOM_MASTER_KEY:?set INDEXLOOM_MASTER_KEY}
      INDEXLOOM_CATALOG_DIR: ${INDEXLOOM_CATALOG_DIR:-}
      INDEXLOOM_CATALOG_ARCHIVE_URL: ${INDEXLOOM_CATALOG_ARCHIVE_URL:-https://github.com/IndexLoom/Indexers/archive/refs/heads/main.tar.gz}
      INDEXLOOM_CATALOG_SYNC_SECONDS: ${INDEXLOOM_CATALOG_SYNC_SECONDS:-21600}
      RUST_LOG: indexloom=info,tower_http=info
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - indexloom-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/api/v1/health
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  indexloom-data:
