# Remote-only IndexLoom launcher. Redirects every request to the remote web
# deployment; it never mounts a local DB or needs an admin/master secret.
services:
  indexloom-external:
    image: ghcr.io/indexloom/indexloom:edge
    ports:
      - "${INDEXLOOM_PORT:-8080}:8080"
    environment:
      INDEXLOOM_RUNTIME_MODE: external
      INDEXLOOM_REMOTE_URL: ${INDEXLOOM_REMOTE_URL:?HTTPS IndexLoom instance required}
      INDEXLOOM_BIND: 0.0.0.0:8080
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
