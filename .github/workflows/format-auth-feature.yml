name: Format auth feature branch
on:
  push:
    branches: [feature/auth-mail-pwa-20261112]
    paths:
      - ".github/workflows/format-auth-feature.yml"
      - "crates/indexloom-server/src/auth/**"
      - "crates/indexloom-server/src/lib.rs"
      - "crates/indexloom-storage/src/auth.rs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auth-feature-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-mail-pwa-20261112
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Format Rust source
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit formatted source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/auth-mail-pwa-20261112
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Work on the latest branch head, rather than losing a concurrent edit.
          # Never force-push; retry only if someone pushed while formatting.
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cargo fmt --all
            git diff --check
            if git diff --quiet -- crates/; then exit 0; fi
            git add crates/
            git commit -m "style(auth): rustfmt all new authentication components"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 1
          done
          echo "Could not push formatted changes without a race" >&2
          exit 1
