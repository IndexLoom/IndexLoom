name: Format auth feature branch
on:
  push:
    branches: [feature/auth-mail-pwa-20261112]
    paths:
      - ".github/workflows/format-auth-feature.yml"
      - "crates/indexloom-server/src/auth/**"
      - "crates/indexloom-storage/src/auth.rs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auth-feature-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-mail-pwa-20261112
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Format Rust source
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit formatted source to feature branch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/
          git commit -m "style(auth): rustfmt all new authentication components"
          git push origin HEAD:feature/auth-mail-pwa-20261112
