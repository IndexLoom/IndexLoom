name: Responsive PWA browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main, feature/auth-mail-pwa-20261112]
    paths: [.github/workflows/visual-pwa.yml]
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/visual-pwa.yml"
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/indexloom-playwright playwright@1.57.0
          /tmp/indexloom-playwright/node_modules/.bin/playwright install chromium --with-deps
      - name: Start static preview
        run: |
          cd web
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 >/tmp/indexloom-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/indexloom-vite.log
          exit 1
      - name: Test phone/tablet/laptop/desktop and save captures
        shell: bash
        run: |
          mkdir -p /tmp/indexloom-screenshots
          node --input-type=module <<'JS'
          import { chromium } from '/tmp/indexloom-playwright/node_modules/playwright/index.mjs';
          const browser = await chromium.launch({ headless: true });
          // Hosted Chromium occasionally returns a transient screenshot protocol error.
          // Retry only screenshot capture; any failed UI assertion still fails the job.
          async function capture(page, path) {
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await page.screenshot({ path, animations: 'disabled', timeout: 20_000 });
                return;
              } catch (error) {
                if (attempt === 3) throw error;
                await page.waitForTimeout(attempt * 500);
              }
            }
          }
          const devices = [
            { width: 320, height: 720 },
            { width: 390, height: 844 },
            { width: 768, height: 1024 },
            { width: 1024, height: 768 },
            { width: 1440, height: 900 },
          ];
          for (const size of devices) {
            const context = await browser.newContext({
              viewport: size,
              deviceScaleFactor: 1,
              isMobile: size.width < 641,
              hasTouch: size.width < 1025,
            });
            const page = await context.newPage();
            await page.route('**/api/v1/auth/config', (route) => route.fulfill({
              status: 200, contentType: 'application/json',
              body: JSON.stringify({
                mode: 'disabled', localEnabled: false,
                oidcEnabled: false, mailEnabled: false,
                emailVerificationRequired: false,
                bootstrapAvailable: false, oidcIssuer: null,
              }),
            }));
            await page.route('**/api/v1/health', (route) => route.fulfill({
              status: 200, contentType: 'application/json',
              body: JSON.stringify({status: 'ok',version: 'test',database: 'ok'}),
            }));
            await page.route('**/api/v1/indexers', (route) => route.fulfill({
              status: 200, contentType: 'application/json', body: '[]',
            }));
            await page.route('**/api/v1/groups', (route) => route.fulfill({
              status: 200, contentType: 'application/json', body: '[]',
            }));
            await page.goto('http://127.0.0.1:4173/', {waitUntil: 'networkidle'});
            const nav = page.locator('nav[aria-label="Primary navigation"] button');
            if (await nav.count() !== 4) throw new Error('Missing navigation at ' + size.width);
            const metrics = await page.evaluate(() => ({
              documentWidth: document.documentElement.scrollWidth,
              viewportWidth: document.documentElement.clientWidth,
            }));
            if (metrics.documentWidth > metrics.viewportWidth + 5) {
              throw new Error('Unexpected page overflow ' + size.width + ': ' + JSON.stringify(metrics));
            }
            if (size.width < 641) {
              const bounds = await page.locator('.sidebar').boundingBox();
              if (!bounds || bounds.y < size.height * .65) {
                throw new Error('Mobile navigation is not bottom-docked at ' + size.width);
              }
            }
            await capture(page, '/tmp/indexloom-screenshots/search-' + size.width + '.png');
            await page.getByRole('button', {name: 'Settings', exact: true}).click();
            await page.getByRole('tab', {name: 'Security & users'}).waitFor();
            await capture(page, '/tmp/indexloom-screenshots/settings-' + size.width + '.png');
            await page.getByRole('combobox', {name: 'Interface language'}).first().selectOption('ru');
            await page.getByRole('heading', {name: 'Настройки', exact: true}).waitFor();
            await capture(page, '/tmp/indexloom-screenshots/settings-ru-' + size.width + '.png');
            await page.reload({waitUntil: 'networkidle'});
            await page.getByRole('heading', {name: 'Настройки', exact: true}).waitFor();
            await page.getByRole('combobox', {name: 'Язык интерфейса'}).first().selectOption('en');
            await page.getByRole('heading', {name: 'Settings', exact: true}).waitFor();
            if (size.width === 390) {
              let sentGenre = null;
              await page.route('**/api/v1/search/stream', async (route) => {
                sentGenre = route.request().postDataJSON().filters.genre;
                await route.fulfill({
                  status: 200, contentType: 'application/x-ndjson',
                  body: '{"type":"started","query":"example","total":0}\n{"type":"finished","completed":0,"total":0,"resultCount":0}\n',
                });
              });
              await page.getByRole('combobox', {name: 'Interface language'}).first().selectOption('ru');
              await page.locator('nav.navigation').getByRole('button', {name: 'Поиск', exact: true}).click();
              await page.locator('.advanced-search summary').click();
              await page.getByPlaceholder('Идентификатор или название жанра').fill('Комедия');
              await page.getByPlaceholder('Фильм, сериал, игра, книга…').fill('example');
              await page.locator('form.search-toolbar').getByRole('button', {name: 'Поиск'}).click();
              await page.locator('.result-groups').waitFor();
              if (sentGenre !== 'Comedy') throw new Error('Genre was not converted to canonical source value: ' + sentGenre);
            }
            await context.close();
          }
          const page = await browser.newPage();
          await page.goto('http://127.0.0.1:4173/');
          for(const path of ['/manifest.webmanifest','/icons/indexloom-180.png','/icons/indexloom-192.png','/icons/indexloom-512.png','/sw.js']){
            const response = await page.request.get('http://127.0.0.1:4173' + path);
            if (!response.ok()) throw new Error('Missing PWA asset: ' + path);
          }
          // Exercise a real React login/logout flow without reaching external services.
          const mobile = await browser.newContext({
            viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true,
          });
          const loginPage = await mobile.newPage();
          await loginPage.route('**/api/v1/auth/config', (route) => route.fulfill({
            status: 200, contentType: 'application/json',
            body: JSON.stringify({
              mode: 'local', localEnabled: true, oidcEnabled: false,
              mailEnabled: false, emailVerificationRequired: false,
              bootstrapAvailable: false, oidcIssuer: null,
            }),
          }));

          await loginPage.route('**/api/v1/auth/login', (route) => route.fulfill({
            status: 200, contentType: 'application/json',
            body: JSON.stringify({
              requiresTotp: true,
              challengeToken: 'example-challenge-for-local-browser-tests-only',
              expiresAt: 1900000000,
            }),
          }));
          await loginPage.route('**/api/v1/auth/totp/complete', (route) => route.fulfill({
            status: 200, contentType: 'application/json',
            body: JSON.stringify({
              accessToken: 'example-authenticated-browser-test-session',
              expiresAt: 1900000000,
              user: {
                id: 'test-user', username: 'alice',
                email: 'alice@example.org', emailVerified: true, role: 'owner',
              },
            }),
          }));
          await loginPage.route('**/api/v1/auth/me', (route) => route.fulfill({
            status: 200, contentType: 'application/json',
            body: JSON.stringify({
              method: 'session',
              user: {
                id: 'test-user', username: 'alice', email: 'alice@example.org',
                emailVerified: true, hasPassword: true, hasOidc: false, disabled: false,
              },
            }),
          }));
          await loginPage.route('**/api/v1/auth/logout', (route) => route.fulfill({
            status: 204, body: '',
          }));
          await loginPage.route('**/api/v1/health', (route) => route.fulfill({
            status: 200, contentType: 'application/json',
            body: JSON.stringify({status: 'ok', version: 'test', database: 'ok'}),
          }));
          await loginPage.route('**/api/v1/indexers', (route) => route.fulfill({
            status: 200, contentType: 'application/json', body: '[]',
          }));
          await loginPage.goto('http://127.0.0.1:4173/', {waitUntil: 'networkidle'});
          await loginPage.getByLabel('Username or email').fill('alice');
          await loginPage.getByLabel('Password', {exact: true}).fill('correct-horse-battery');
          await capture(loginPage, '/tmp/indexloom-screenshots/login-mobile.png');
          await loginPage.getByRole('button', {name:'Sign in', exact:true}).click();
          await loginPage.getByRole('heading', {name:'Verify second factor'}).waitFor();
          await loginPage.getByLabel('Authenticator or recovery code').fill('123456');
          await loginPage.getByRole('button', {name:'Verify and sign in'}).click();
          await loginPage.locator('nav[aria-label="Primary navigation"]').waitFor();
          await loginPage.getByRole('button', {name:'Sign out'}).click();
          await loginPage.getByRole('heading', {name:'Welcome back'}).waitFor();
          await mobile.close();

          await page.evaluate(async () => {
            if (!('serviceWorker' in navigator)) throw new Error('Service worker unsupported');
            await navigator.serviceWorker.ready;
            const names = await caches.keys();
            for (const name of names) {
              const cache = await caches.open(name);
              for (const request of await cache.keys()) {
                const url = new URL(request.url);
                if (url.pathname.startsWith('/api/') || url.search.includes('access_token')) {
                  throw new Error('Private response or token was cached: ' + url.pathname);
                }
              }
            }
          });
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-pwa-captures
          path: /tmp/indexloom-screenshots/
          if-no-files-found: warn
