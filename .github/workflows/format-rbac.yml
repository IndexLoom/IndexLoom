name: Format auth/RBAC branch
on:
  push:
    branches: [feature/auth-mail-pwa-20261112]
    paths: [.github/workflows/format-rbac.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: format-auth-rbac
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-mail-pwa-20261112
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Apply cargo fmt and push changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin feature/auth-mail-pwa-20261112
            git reset --hard origin/feature/auth-mail-pwa-20261112
            cargo fmt --all
            git diff --check
            git add crates/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "style(auth): rustfmt RBAC and audit modules"
            if git push origin HEAD:feature/auth-mail-pwa-20261112; then exit 0; fi
          done
          echo "Concurrent feature changes prevented a safe formatter push" >&2
          exit 1
