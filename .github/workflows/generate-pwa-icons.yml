name: Generate PWA icons
on:
  workflow_dispatch:
  push:
    branches: [feature/auth-mail-pwa-20261112]
    paths:
      - .github/workflows/generate-pwa-icons.yml
      - web/public/icons/indexloom.svg
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-mail-pwa-20261112
          fetch-depth: 0
      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Render standard iOS and Android icon sizes
        run: |
          set -euo pipefail
          for size in 180 192 512; do
            rsvg-convert --width "$size" --height "$size" \
              --output "web/public/icons/indexloom-$size.png" \
              web/public/icons/indexloom.svg
          done
          file web/public/icons/*.png
      - name: Commit icon assets
        run: |
          set -euo pipefail
          git add web/public/icons/indexloom-*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(pwa): add PNG app icons for iOS and Android"
          git push origin HEAD:feature/auth-mail-pwa-20261112
