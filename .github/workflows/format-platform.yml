name: Format platform refactor branch
on:
  push:
    branches: [feature/cross-platform-core-mobile-20261113]
    paths: [.github/workflows/format-platform.yml]
permissions:
  contents: write
concurrency:
  group: indexloom-platform-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cross-platform-core-mobile-20261113
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Format Rust modules and commit safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin feature/cross-platform-core-mobile-20261113
            git reset --hard origin/feature/cross-platform-core-mobile-20261113
            cargo fmt --all
            git diff --check
            git add crates/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "style(platform): cargo fmt extracted modules and shared runtimes"
            if git push origin HEAD:feature/cross-platform-core-mobile-20261113; then exit 0; fi
          done
          echo "Concurrent changes prevented safe format push" >&2
          exit 1

# Follow-up run after CLI and Cardigann module extraction.
