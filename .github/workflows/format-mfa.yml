name: Format MFA feature Rust
on:
  push:
    branches: [feature/auth-mail-pwa-20261112]
    paths: [.github/workflows/format-mfa.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: format-mfa-feature
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-mail-pwa-20261112
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Format current HEAD without overwriting concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/auth-mail-pwa-20261112
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cargo fmt --all
            git diff --check
            if git diff --quiet -- crates/; then exit 0; fi
            git add crates/
            git commit -m "style(mfa): rustfmt new authenticator components"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          exit 1
