name: Cross-platform application release

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "migrations/**"
      - "web/**"
      - "apps/native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: indexloom-application-release-v2
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[workspace.package\]/{seen=1;next} /^\[/{if(seen)exit} seen && /^version =/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          test -n "$VERSION"
          echo "tag=v${VERSION}-dev.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck && pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, label: linux-x86_64, exe: indexloom-server }
          - { runner: ubuntu-24.04-arm, label: linux-aarch64, exe: indexloom-server }
          - { runner: windows-2025, label: windows-x86_64, exe: indexloom-server.exe }
          - { runner: macos-15, label: macos-aarch64, exe: indexloom-server }
          - { runner: macos-15-intel, label: macos-x86_64, exe: indexloom-server }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build web-enabled and headless Rust binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cargo build --locked --release -p indexloom-server --features embedded-web
          cp "target/release/${{ matrix.exe }}" "release/indexloom-web-${{ matrix.label }}${{ matrix.exe == 'indexloom-server.exe' && '.exe' || '' }}"
          cargo build --locked --release -p indexloom-server --features headless
          cp "target/release/${{ matrix.exe }}" "release/indexloom-headless-${{ matrix.label }}${{ matrix.exe == 'indexloom-server.exe' && '.exe' || '' }}"
          cp LICENSE release/LICENSE
          mkdir -p artifacts
          if [[ "${{ matrix.label }}" == windows-* ]]; then
            (cd release && 7z a "../artifacts/indexloom-${{ matrix.label }}.zip" . >/dev/null)
          else
            tar -czf "artifacts/indexloom-${{ matrix.label }}.tar.gz" -C release .
          fi
      - name: Smoke-test first startup and released catalog
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          export INDEXLOOM_ADMIN_TOKEN="$(openssl rand -hex 32)"
          export INDEXLOOM_MASTER_KEY="$(openssl rand -base64 32)"
          export INDEXLOOM_DATABASE_URL="sqlite://$RUNNER_TEMP/indexloom-smoke.db?mode=rwc"
          export INDEXLOOM_BIND="127.0.0.1:18080"
          export INDEXLOOM_CATALOG_SYNC_SECONDS=0
          ./release/indexloom-web-linux-x86_64 > "$RUNNER_TEMP/indexloom-smoke.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=false
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:18080/api/v1/health >/dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$READY" != "true" ]]; then
            cat "$RUNNER_TEMP/indexloom-smoke.log"
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $INDEXLOOM_ADMIN_TOKEN" \
            http://127.0.0.1:18080/api/v1/indexers | jq -e 'length >= 550'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $INDEXLOOM_ADMIN_TOKEN" \
            http://127.0.0.1:18080/api/v1/catalog/status \
            | jq -e '.availableDefinitions >= 550 and .retiredDefinitions == 0'
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  mobile:
    uses: ./.github/workflows/mobile.yml
    permissions:
      contents: read

  # Compile ARM64 on GitHub's actual ARM64 runner, never under QEMU on x86.
  # Buildx cache scopes are architecture-specific so the compiled Rust layer
  # cannot be restored for an incompatible CPU target.
  docker-platform:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native ${{ matrix.platform }} image and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/indexloom/indexloom
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=indexloom-docker-${{ matrix.arch }}
          cache-to: type=gha,scope=indexloom-docker-${{ matrix.arch }},mode=max
      - name: Record immutable digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Only after BOTH platform builds succeed, publish the manifest list.
  # Never replace :edge with a single-architecture image or incomplete build.
  docker:
    needs: [version, docker-platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish and verify multi-architecture manifest
        shell: bash
        env:
          IMAGE: ghcr.io/indexloom/indexloom
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#digests[@]}" -eq 2
          refs=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:edge" \
            "${refs[@]}"
          docker buildx imagetools inspect --raw "$IMAGE:$TAG" \
            | jq -e '[.manifests[] | select(.platform.os == "linux" and
                (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
                | .platform.architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools inspect "$IMAGE:$TAG"

  publish:
    needs: [version, binaries, mobile, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: application-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: indexloom-native-android-arm64
          path: dist/mobile/android
      - uses: actions/download-artifact@v4
        with:
          name: indexloom-native-ios-arm64-unsigned
          path: dist/mobile/ios
      - name: Verify packages and publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(find dist/mobile/android -type f -name '*.apk' | wc -l)" -ge 1
          test -s dist/mobile/ios/indexloom-ios-arm64-unsigned.ipa
          mkdir -p dist/release-assets
          cp dist/mobile/ios/indexloom-ios-arm64-unsigned.ipa dist/release-assets/
          find dist/mobile/android -type f -name '*.apk' -exec cp {} dist/release-assets/ \;
          cp dist/mobile/ios/indexloom-ios-arm64-unsigned-xcarchive.zip dist/release-assets/
          mv dist/*.tar.gz dist/*.zip dist/release-assets/
          (cd dist/release-assets && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/release-assets/* --target "$GITHUB_SHA" --prerelease \
            --title "IndexLoom $TAG" \
            --notes "IndexLoom pre-release: server web-enabled and headless binaries for Linux, Windows, macOS; Android ARM64 APK; unsigned iOS ARM64 IPA and Xcode archive (sign before installation). Docker multi-arch: ghcr.io/indexloom/indexloom:$TAG. Indexer catalog updates independently."
