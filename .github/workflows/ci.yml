name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - checks: advisories
            advisory: true
          - checks: bans licenses sources
            advisory: false
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: 1.98.0
          arguments: --all-features --locked
          command: check ${{ matrix.checks }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm test:history
      - run: pnpm typecheck
      - run: pnpm build

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify SQLite snapshots and offline restore safety
        run: python3 -m unittest discover -s tests -p "test_backup.py" -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate token-compatible default Compose
        env:
          INDEXLOOM_ADMIN_TOKEN: test-operator-secret-longer-than-32-characters
          INDEXLOOM_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose -f compose.yaml config --quiet
      - name: Validate no-operator OIDC Compose
        env:
          INDEXLOOM_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          INDEXLOOM_AUTH_MODE: oidc
        run: docker compose -f compose.no-operator.yaml config --quiet
      - name: Validate explicitly disabled authentication Compose
        env:
          INDEXLOOM_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          INDEXLOOM_AUTH_MODE: disabled
          INDEXLOOM_ALLOW_UNSAFE_NO_AUTH: "true"
        run: docker compose -f compose.no-operator.yaml config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: indexloom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
