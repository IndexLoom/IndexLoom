name: Refresh auth feature lockfile

on:
  push:
    branches: [feature/auth-mail-pwa-20261112]
    paths:
      - Cargo.toml
      - crates/indexloom-server/Cargo.toml
      - .github/workflows/auth-branch-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-mail-pwa-20261112
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Resolve new crates for the feature branch
        run: cargo update
      - name: Commit reviewed Cargo.lock change to feature branch
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(auth): lock authentication and SMTP dependencies"
          git push origin HEAD:feature/auth-mail-pwa-20261112
